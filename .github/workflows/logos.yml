name: Fetch site logos

# Downloads a logo for every site on the Services page into icons/sites, so logos show
# without asking an outside icon service each time (and still show where that service is blocked).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/fetch-logos.js
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add icons/sites js/site-icons.js
          git diff --cached --quiet || git commit -m "Update bundled site logos"
          git push
